[package]
name = "agent_engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "Demo-only out-of-process JSON-RPC agent engine stub (Tokio)."

[[bin]]
name = "agent_engine"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
lto = true
codegen-units = 1
