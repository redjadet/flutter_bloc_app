name: secure_core_bridge
publish_to: none
description: >
  Demo-only Dart FFI bridge to the Rust secure_core AES-GCM library.
  Linux native is for CI/host tests only — not a product-supported desktop target.
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  # Aligned with native_toolchain_rust 1.0.6 (code_assets ^1.2.1, hooks ^2.1.0).
  code_assets: ^1.2.1
  ffi: ^2.2.0
  hooks: ^2.2.0
  native_toolchain_rust: ^1.0.6

dev_dependencies:
  # Generator only; bindings are checked in. Gate runs package-cwd dart test
  # (workspace-root dart test can miss native assets after ffigen regenerate).
  ffigen: ^21.0.0
  lints: ^6.1.0
  test: ^1.31.1
