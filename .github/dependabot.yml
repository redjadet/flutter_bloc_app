# Dependabot configuration as backup to Renovate
# Note: Renovate is the primary dependency update tool
# Dependabot will only monitor for security vulnerabilities

version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Zero disables version-update PRs; security-update PRs remain enabled.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "security"
      include: "scope"

  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Zero disables version-update PRs; security-update PRs remain enabled.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "security"
      include: "scope"

  # Action security bumps. Renovate owns routine version updates.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Zero disables version-update PRs; security-update PRs remain enabled.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
      - "github-actions"
    commit-message:
      prefix: "security"
      include: "scope"

  # Firebase Functions Node security bumps. Renovate owns routine version updates.
  - package-ecosystem: "npm"
    directory: "/backend/firebase/functions"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    # Zero disables version-update PRs; security-update PRs remain enabled.
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
      - "security"
      - "npm"
    commit-message:
      prefix: "security"
      include: "scope"
