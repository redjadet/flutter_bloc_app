# Replaces GitHub "default setup" (automatic) CodeQL so we only scan languages
# this repo actually ships, with build-mode: none for compiled extractors.
# Excludes java-kotlin and swift — autobuild for Android/iOS Gradle/Xcode failed
# with "build command failed" / no source seen; Dart is not a CodeQL language.
name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  merge_group:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Checkout repository for change scope
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Determine documentation-only scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          docs_only="$(./bin/checklist --print-scope)"
          case "$docs_only" in
            docs_only=true|docs_only=false) ;;
            *) echo "Invalid checklist scope: $docs_only" >&2; exit 1 ;;
          esac
          echo "$docs_only" >> "$GITHUB_OUTPUT"

  analyze:
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Keep PR + push coverage. Drop ruby — no first-party Ruby in this repo
          # (only vendored build checkouts). Retain c-cpp for native/.
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
