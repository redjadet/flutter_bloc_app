name: bloc_codegen
publish_to: none
description: Custom code generators for BLoC/Cubit patterns
version: 1.0.0
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  analyzer: 14.6.0
  bloc_annotations:
    path: ../../packages/bloc_annotations
  # build_runner 2.17.1 resolves build 5.0.x. source_gen 4.3 and retrofit_generator 10.3 allow it.
  build: ^5.0.0
  dart_style: 3.1.14
  source_gen: ^4.3.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
