plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

import java.nio.charset.StandardCharsets
import java.util.Base64

def googleServicesFile = file("google-services.json")
if (googleServicesFile.exists()) {
    apply plugin: "com.google.gms.google-services"
    apply plugin: "com.google.firebase.crashlytics"
} else {
    logger.lifecycle("google-services.json not found; skipping Google Services and Crashlytics Gradle plugins.")
}


def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.ilkersevim.blocflutter"
    // permission_handler_android 14 requires compileSdk 37; Flutter default is still 36.
    compileSdk = 37
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        test.java.srcDirs += "src/test/kotlin"
    }

    testOptions {
        unitTests.includeAndroidResources = false
    }

    defaultConfig {
        applicationId = "com.ilkersevim.blocflutter"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        def googleMapsAndroidApiKey =
            project.findProperty("GOOGLE_MAPS_ANDROID_API_KEY") ?:
            System.getenv("GOOGLE_MAPS_ANDROID_API_KEY") ?:
            System.getenv("GOOGLE_MAPS_API_KEY")
        manifestPlaceholders["GOOGLE_MAPS_API_KEY"] =
            googleMapsAndroidApiKey ?: "YOUR_ANDROID_GOOGLE_MAPS_API_KEY"
    }

    packaging {
        resources {
            pickFirsts += ["META-INF/NOTICE.md", "META-INF/LICENSE.md"]
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.getByName("release")
            } else {
                project.gradle.taskGraph.whenReady { taskGraph ->
                    final boolean isReleaseBuild = taskGraph.allTasks.any { task ->
                        final String name = task.name.toLowerCase()
                        name.contains("release") && !name.contains("debug")
                    }
                    if (isReleaseBuild) {
                        throw new GradleException(
                            "Release signing requires android/key.properties and a valid keystore."
                        )
                    }
                }
            }
        }
    }
}

// Dart defines are compiled into Flutter release artifacts. These values must
// stay server-side; accepting one here would make it recoverable from an APK.
def releaseForbiddenDartDefineKeys = [
    "HUGGINGFACE_API_KEY",
    "GEMINI_API_KEY",
    "GOOGLE_API_KEY",
    "CHAT_FASTAPICLOUD_DEMO_SECRET",
    "CHAT_RENDER_DEMO_SECRET",
] as Set

Set<String> releaseDartDefineKeys() {
    final Object rawDefines = project.findProperty("dart-defines")
    if (rawDefines == null || rawDefines.toString().trim().isEmpty()) {
        return [] as Set<String>
    }
    return rawDefines.toString().split(",").collect { String encoded ->
        for (decoder in [Base64.getDecoder(), Base64.getUrlDecoder()]) {
            try {
                final String decoded = new String(
                    decoder.decode(encoded),
                    StandardCharsets.UTF_8,
                )
                return decoded.split("=", 2)[0]
            } catch (IllegalArgumentException ignored) {
                // Try the alternate standard/URL-safe decoder.
            }
        }
        return null
    }.findAll { it != null } as Set<String>
}

gradle.taskGraph.whenReady { taskGraph ->
    final boolean isReleaseBuild = taskGraph.allTasks.any { task ->
        final String name = task.name.toLowerCase()
        name.contains("release") && !name.contains("debug")
    }
    if (!isReleaseBuild) {
        return
    }
    final Set<String> prohibited = releaseDartDefineKeys().intersect(
        releaseForbiddenDartDefineKeys,
    )
    if (!prohibited.isEmpty()) {
        throw new GradleException(
            "Release builds reject client-bundled secret dart-defines: " +
            prohibited.sort().join(", ") +
            ". Move these credentials to a trusted backend.",
        )
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation "androidx.sqlite:sqlite:2.7.0"
    implementation "net.zetetic:sqlcipher-android:4.18.0"
    implementation "androidx.biometric:biometric:1.1.0"
    testImplementation "junit:junit:4.13.2"
}

afterEvaluate {
    tasks.named("assembleDebug").configure {
        doLast {
            def sourceApk = layout.buildDirectory.file("outputs/flutter-apk/app-debug.apk").get().asFile
            if (sourceApk.exists()) {
                def destApk = rootProject.projectDir.toPath().resolve("../build/app/outputs/flutter-apk/app-debug.apk").toFile().canonicalFile
                destApk.parentFile.mkdirs()
                java.nio.file.Files.copy(sourceApk.toPath(), destApk.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
            }
        }
    }
}
